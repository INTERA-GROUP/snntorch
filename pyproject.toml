[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snntorch"
dynamic = ["version"]
description = "Deep learning with spiking neural networks."
readme = "README.rst"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason K. Eshraghian", email = "jeshragh@ucsc.edu" }]
keywords = ["snntorch", "spiking neural networks", "pytorch"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "torch",
    "numpy",
]

[project.optional-dependencies]
# snntorch.export_nir, snntorch.import_nir
nir = ["nir>=1.0.6", "nirtorch>=2.0.5"]
# snntorch.spikeplot
plot = ["matplotlib", "pandas"]
# snntorch.spikevision (deprecated) and the dataset helpers in snntorch.utils
vision = ["torchvision", "h5py", "tqdm", "pandas", "matplotlib"]

[project.urls]
Homepage = "https://github.com/jeshraghian/snntorch"
Documentation = "https://snntorch.readthedocs.io"
Fork = "https://github.com/INTERA-GROUP/snntorch"

[dependency-groups]
test = [
    "snntorch[nir,plot,vision]",  # the tests exercise every optional feature
    "pytest>=8",
    "coverage>=7",
]
lint = [
    "ruff",
    "mypy",
    "pre-commit",
]
docs = [
    "sphinx>=7.1",
    "sphinx-rtd-theme",
    "watchdog",
    "celluloid",
]
release = [
    "build",
    "twine",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "release" },
    "tox",
]

[tool.uv]
default-groups = ["dev"]

# CPU-only torch wheels for development environments and CI (smaller, no
# CUDA download). macOS wheels on PyPI are CPU builds already. This only
# affects uv; the published package metadata stays a plain `torch`.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["snntorch", "snntorch.*"]

[tool.setuptools.package-data]
snntorch = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "snntorch._version.__version__" }

[tool.mypy]
python_version = "3.11"
files = ["snntorch"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Lenient start: functions without annotations are not checked. Tighten
# per module (disallow_untyped_defs, check_untyped_defs) as typing grows.

[[tool.mypy.overrides]]
module = [
    "nir.*",
    "nirtorch.*",
    "h5py.*",
    "pandas.*",
    "tqdm.*",
    "six.*",
    "pylab.*",
    "dv.*",
    "importRosbag.*",
    "torchvision.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length is left to `ruff format`; long docstrings stay as is
]

[tool.ruff.lint.per-file-ignores]
# Re-exports and star imports are the public API of these packages.
"__init__.py" = ["F401", "F403"]
"snntorch/_layers/__init__.py" = ["F405"]
"snntorch/_neurons/__init__.py" = ["F405", "E402"]

[tool.ruff.format]
quote-style = "double"
