[tox]
envlist = py311, py312, py313, flake8

[gh-actions]
python =
    3.13: py313
    3.12: py312
    3.11: py311

[testenv:flake8]
basepython = python
deps = flake8
commands = flake8 snntorch tests

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
extras =
    nir
    plot
deps =
    pytest>=8
commands =
    pytest --basetemp={envtmpdir}
