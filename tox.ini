[tox]
envlist = py311, py312, py313, ruff

[gh-actions]
python =
    3.13: py313
    3.12: py312
    3.11: py311

[testenv:ruff]
basepython = python
deps = ruff
commands = ruff check snntorch tests

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
extras =
    nir
    plot
deps =
    pytest>=8
commands =
    pytest --basetemp={envtmpdir}
